# GitHub Pages configuration for the Ebb support site.
#
# `jekyll-theme-minimal` is kept as the base only for its layout — the
# skeleton that turns a markdown file into a page. Everything visual is
# overridden in assets/css/style.scss, because every stock Jekyll theme
# is light and Ebb is not.
#
# Removing the theme entirely would mean writing a layout by hand for
# no gain; overriding its stylesheet is the supported way to do this.
title: Ebb
description: Time, visualized.
theme: jekyll-theme-minimal

# Serve pages without .html so links match the URLs in the app.
permalink: pretty
